# 宿主机 Nginx 站点配置（已安装在服务器 /etc/nginx/conf.d/dod-goodpoint.conf，此处为备份参考）
# 反代本机 Docker 容器 dod-web（127.0.0.1:8310）

# 80 端口：certbot webroot 验证 + 301 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dod.goodpoint.top;

    location /.well-known/acme-challenge/ {
        root /opt/certbot/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：HTTPS 反代到 dod-web 容器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dod.goodpoint.top;

    ssl_certificate /etc/letsencrypt/live/dod.goodpoint.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dod.goodpoint.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 联网排行榜 API（本机 dod-leaderboard 容器）
    location /api/ {
        proxy_pass http://127.0.0.1:8320;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_read_timeout 15s;
    }

    # 敏感路径拦截（与其他站点策略一致）
    location ~ /\.(git|svn|hg|env|aws|ssh) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8310;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
