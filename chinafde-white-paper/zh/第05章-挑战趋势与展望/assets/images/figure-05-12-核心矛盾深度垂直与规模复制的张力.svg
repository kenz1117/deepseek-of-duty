<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="360" fill="#f6f3ec"></rect>
  <text x="34" y="34" font-size="17" font-weight="700" fill="#14233f">图5-1　核心矛盾：深度（垂直）与规模（复制）的张力</text>

  <!-- 支点 -->
  <polygon points="340,300 312,250 368,250" fill="#9a6a2f"></polygon>
  <line x1="340" y1="250" x2="340" y2="210" stroke="#9a6a2f" stroke-width="3"></line>

  <!-- 横梁 -->
  <line x1="120" y1="210" x2="560" y2="210" stroke="#14233f" stroke-width="3"></line>

  <!-- 左盘：深度 -->
  <line x1="180" y1="210" x2="180" y2="258" stroke="#14233f" stroke-width="1.5"></line>
  <path d="M140 258 Q180 300 220 258 Z" fill="#2e4a78"></path>
  <text x="180" y="288" font-size="13" font-weight="700" fill="#14233f" text-anchor="middle">深度</text>
  <text x="180" y="328" font-size="11" fill="#14233f" text-anchor="middle">垂直行业 · 强监管</text>
  <text x="180" y="344" font-size="11" fill="#2e4a78" text-anchor="middle">稀缺即壁垒</text>

  <!-- 右盘：规模 -->
  <line x1="500" y1="210" x2="500" y2="258" stroke="#14233f" stroke-width="1.5"></line>
  <path d="M460 258 Q500 300 540 258 Z" fill="#9a6a2f"></path>
  <text x="500" y="288" font-size="13" font-weight="700" fill="#14233f" text-anchor="middle">规模</text>
  <text x="500" y="328" font-size="11" fill="#14233f" text-anchor="middle">标准化 · 可复制</text>
  <text x="500" y="344" font-size="11" fill="#9a6a2f" text-anchor="middle">边际成本递减</text>

  <text x="340" y="120" font-size="13" font-weight="700" fill="#9a6a2f" text-anchor="middle">核心矛盾</text>
  <text x="340" y="146" font-size="11" fill="#6b6457" text-anchor="middle">越深越难复制，越复制越浅</text>
</svg>
