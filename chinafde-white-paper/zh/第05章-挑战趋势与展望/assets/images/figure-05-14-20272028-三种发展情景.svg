<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="410" fill="#f6f3ec"></rect>
  <text x="34" y="34" font-size="17" font-weight="700" fill="#14233f">图5-3　2027–2028 三种发展情景</text>

  <!-- 根节点 -->
  <rect x="30" y="175" width="150" height="60" rx="6" fill="#14233f"></rect>
  <text x="105" y="200" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Agent 是否真正</text>
  <text x="105" y="218" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">进入生产系统？</text>

  <!-- 连接线 -->
  <g stroke="#14233f" stroke-width="1.5" fill="none">
    <path d="M180 205 L215 110"></path>
    <path d="M180 205 L215 205"></path>
    <path d="M180 205 L215 300"></path>
  </g>

  <!-- 卡片1 谨慎扩散 -->
  <rect x="215" y="60" width="140" height="300" rx="6" fill="#ffffff" stroke="#2e4a78" stroke-width="2"></rect>
  <rect x="215" y="60" width="140" height="34" rx="6" fill="#2e4a78"></rect>
  <text x="285" y="82" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">情景一</text>
  <text x="225" y="116" font-size="11.5" fill="#14233f">谨慎扩散</text>
  <text x="225" y="146" font-size="11" fill="#14233f">· 助手化为主</text>
  <text x="225" y="170" font-size="11" fill="#14233f">· 关键动作仍由人</text>
  <text x="225" y="194" font-size="11" fill="#14233f">· FDE 隐性存在</text>
  <line x1="225" y1="300" x2="345" y2="300" stroke="#d8d0bf"></line>
  <text x="225" y="324" font-size="10.5" fill="#9a3a2f">风险：AI 价值</text>
  <text x="225" y="340" font-size="10.5" fill="#9a3a2f">难以证明</text>

  <!-- 卡片2 稳步生产化（倾向） -->
  <rect x="365" y="60" width="140" height="300" rx="6" fill="#ffffff" stroke="#9a6a2f" stroke-width="2.5"></rect>
  <rect x="365" y="60" width="140" height="34" rx="6" fill="#9a6a2f"></rect>
  <text x="435" y="82" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">情景二 ★</text>
  <text x="375" y="116" font-size="11.5" fill="#14233f">稳步生产化</text>
  <text x="375" y="146" font-size="11" fill="#14233f">· 标准场景落地</text>
  <text x="375" y="170" font-size="11" fill="#14233f">· FDE 成核心角色</text>
  <text x="375" y="194" font-size="11" fill="#14233f">· 效果付费上升</text>
  <line x1="375" y1="300" x2="495" y2="300" stroke="#d8d0bf"></line>
  <text x="375" y="324" font-size="10.5" fill="#9a3a2f">风险：场景割裂</text>
  <text x="375" y="340" font-size="10.5" fill="#9a3a2f">口径不统一</text>

  <!-- 卡片3 深度组织化 -->
  <rect x="515" y="60" width="140" height="300" rx="6" fill="#ffffff" stroke="#14233f" stroke-width="2"></rect>
  <rect x="515" y="60" width="140" height="34" rx="6" fill="#14233f"></rect>
  <text x="585" y="82" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">情景三</text>
  <text x="525" y="116" font-size="11.5" fill="#14233f">深度组织化</text>
  <text x="525" y="146" font-size="11" fill="#14233f">· 多 Agent 协同</text>
  <text x="525" y="170" font-size="11" fill="#14233f">· 内化岗位族</text>
  <text x="525" y="194" font-size="11" fill="#14233f">· 认证体系成型</text>
  <line x1="525" y1="300" x2="645" y2="300" stroke="#d8d0bf"></line>
  <text x="525" y="324" font-size="10.5" fill="#9a3a2f">风险：权责重划</text>
  <text x="525" y="340" font-size="10.5" fill="#9a3a2f">组织摩擦</text>

  <text x="34" y="392" font-size="11" fill="#6b6457">★ 本报告倾向：2027–2028 中国市场更可能先落入"稳步生产化"，而非一步跨入深度组织化。</text>
</svg>
