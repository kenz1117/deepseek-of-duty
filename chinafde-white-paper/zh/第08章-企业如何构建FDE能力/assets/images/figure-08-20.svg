<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Hiragino Sans GB&quot;,sans-serif">
  <rect width="960" height="600" fill="#f6f3ec"/>
  <text x="480" y="46" text-anchor="middle" fill="#14233f" font-size="20" font-weight="700" font-family="&quot;Playfair Display&quot;,&quot;Songti SC&quot;,Georgia,serif">三路径决策矩阵：自建 / 伙伴 / 外包的适用边界</text>
  <text x="480" y="70" text-anchor="middle" fill="#5e6b82" font-size="13">多数普通企业应从「伙伴 + 外包试点」起步，用 1–2 个成功场景换取内部认知与议价权，再决定是否自建</text>

  <!-- Card 1: 自建团队 -->
  <rect x="24" y="92" width="288" height="464" rx="12" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.5"/>
  <rect x="24" y="92" width="288" height="44" rx="12" fill="#14233f"/>
  <rect x="24" y="114" width="288" height="22" fill="#14233f"/>
  <text x="168" y="121" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">自建团队</text>
  <text x="42" y="160" fill="#9a6a2f" font-size="12.5" font-weight="700">适用企业</text>
  <text x="42" y="180" fill="#14233f" font-size="13">场景持续且量大、数据敏感</text>
  <text x="42" y="198" fill="#14233f" font-size="13">的央国企 / 大型民企</text>
  <line x1="38" y1="212" x2="298" y2="212" stroke="#d8cfbd" stroke-width="1"/>
  <text x="42" y="238" fill="#9a6a2f" font-size="12.5" font-weight="700">启动周期</text>
  <text x="42" y="258" fill="#14233f" font-size="13">3–6 个月</text>
  <line x1="38" y1="272" x2="298" y2="272" stroke="#d8cfbd" stroke-width="1"/>
  <text x="42" y="298" fill="#9a6a2f" font-size="12.5" font-weight="700">成本结构</text>
  <text x="42" y="318" fill="#14233f" font-size="13">高（编制 + 长期薪酬）</text>
  <line x1="38" y1="332" x2="298" y2="332" stroke="#d8cfbd" stroke-width="1"/>
  <text x="42" y="358" fill="#9a6a2f" font-size="12.5" font-weight="700">能力沉淀</text>
  <text x="42" y="378" fill="#14233f" font-size="13">最强，沉淀在企业内部</text>
  <line x1="38" y1="392" x2="298" y2="392" stroke="#d8cfbd" stroke-width="1"/>
  <text x="42" y="418" fill="#9a6a2f" font-size="12.5" font-weight="700">主要风险</text>
  <text x="42" y="438" fill="#14233f" font-size="13">招不到、养不起、核心</text>
  <text x="42" y="456" fill="#14233f" font-size="13">流失即断档</text>
  <line x1="38" y1="470" x2="298" y2="470" stroke="#d8cfbd" stroke-width="1"/>

  <!-- Card 2: 厂商生态伙伴 -->
  <rect x="336" y="92" width="288" height="464" rx="12" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.5"/>
  <rect x="336" y="92" width="288" height="44" rx="12" fill="#27406b"/>
  <rect x="336" y="114" width="288" height="22" fill="#27406b"/>
  <text x="480" y="121" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">厂商生态伙伴</text>
  <text x="354" y="160" fill="#9a6a2f" font-size="12.5" font-weight="700">适用企业</text>
  <text x="354" y="180" fill="#14233f" font-size="13">已深度使用某云平台</text>
  <text x="354" y="198" fill="#14233f" font-size="13">/ 大模型的企业</text>
  <line x1="350" y1="212" x2="610" y2="212" stroke="#d8cfbd" stroke-width="1"/>
  <text x="354" y="238" fill="#9a6a2f" font-size="12.5" font-weight="700">启动周期</text>
  <text x="354" y="258" fill="#14233f" font-size="13">2–8 周</text>
  <line x1="350" y1="272" x2="610" y2="272" stroke="#d8cfbd" stroke-width="1"/>
  <text x="354" y="298" fill="#9a6a2f" font-size="12.5" font-weight="700">成本结构</text>
  <text x="354" y="318" fill="#14233f" font-size="13">中等（项目 / 订阅）</text>
  <line x1="350" y1="332" x2="610" y2="332" stroke="#d8cfbd" stroke-width="1"/>
  <text x="354" y="358" fill="#9a6a2f" font-size="12.5" font-weight="700">能力沉淀</text>
  <text x="354" y="378" fill="#14233f" font-size="13">中等，部分在伙伴侧</text>
  <line x1="350" y1="392" x2="610" y2="392" stroke="#d8cfbd" stroke-width="1"/>
  <text x="354" y="418" fill="#9a6a2f" font-size="12.5" font-weight="700">主要风险</text>
  <text x="354" y="438" fill="#14233f" font-size="13">供应商锁定、排期冲突</text>
  <line x1="350" y1="470" x2="610" y2="470" stroke="#d8cfbd" stroke-width="1"/>

  <!-- Card 3: 外包 / 项目制 -->
  <rect x="648" y="92" width="288" height="464" rx="12" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.5"/>
  <rect x="648" y="92" width="288" height="44" rx="12" fill="#9a6a2f"/>
  <rect x="648" y="114" width="288" height="22" fill="#9a6a2f"/>
  <text x="792" y="121" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">外包 / 项目制</text>
  <text x="666" y="160" fill="#9a6a2f" font-size="12.5" font-weight="700">适用企业</text>
  <text x="666" y="180" fill="#14233f" font-size="13">单点验证、暂无编制</text>
  <text x="666" y="198" fill="#14233f" font-size="13">的成长型 / 中小企业</text>
  <line x1="662" y1="212" x2="922" y2="212" stroke="#d8cfbd" stroke-width="1"/>
  <text x="666" y="238" fill="#9a6a2f" font-size="12.5" font-weight="700">启动周期</text>
  <text x="666" y="258" fill="#14233f" font-size="13">1–4 周</text>
  <line x1="662" y1="272" x2="922" y2="272" stroke="#d8cfbd" stroke-width="1"/>
  <text x="666" y="298" fill="#9a6a2f" font-size="12.5" font-weight="700">成本结构</text>
  <text x="666" y="318" fill="#14233f" font-size="13">按人天 / 成果，弹性大</text>
  <line x1="662" y1="332" x2="922" y2="332" stroke="#d8cfbd" stroke-width="1"/>
  <text x="666" y="358" fill="#9a6a2f" font-size="12.5" font-weight="700">能力沉淀</text>
  <text x="666" y="378" fill="#14233f" font-size="13">弱，易随团队离场</text>
  <line x1="662" y1="392" x2="922" y2="392" stroke="#d8cfbd" stroke-width="1"/>
  <text x="666" y="418" fill="#9a6a2f" font-size="12.5" font-weight="700">主要风险</text>
  <text x="666" y="438" fill="#14233f" font-size="13">人肉外包化、无资产</text>
  <line x1="662" y1="470" x2="922" y2="470" stroke="#d8cfbd" stroke-width="1"/>

  <text x="480" y="582" text-anchor="middle" fill="#5e6b82" font-size="11.5">过早自建易养出无战场可打的昂贵团队；过晚自建则长期被外部排期与定价绑定。</text>
</svg>
