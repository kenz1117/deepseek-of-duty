<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><rect width="840" height="480" fill="#f6f3ec"></rect><text x="420.0" y="40" text-anchor="middle" fill="#14233f" font-size="19" font-weight="700" font-family="'Noto Serif SC','Songti SC',serif">自下而上的市场规模估算框架</text><path d="M140.0 90 L700.0 90 L665.0 156 L175.0 156 Z" fill="#14233f" opacity="0.92"></path><text x="420.0" y="120" text-anchor="middle" fill="#f6f3ec" font-size="15" font-weight="700">目标企业基数</text><text x="420.0" y="140" text-anchor="middle" fill="#e7e0d2" font-size="11.5">按行业 × 规模分层的潜在客户数</text><text x="420.0" y="168" text-anchor="middle" fill="#9a6a2f" font-size="20" font-weight="800">↓</text><path d="M175.0 170 L665.0 170 L630.0 236 L210.0 236 Z" fill="#1d3a5f" opacity="0.92"></path><text x="420.0" y="200" text-anchor="middle" fill="#f6f3ec" font-size="15" font-weight="700">× FDE 渗透率</text><text x="420.0" y="220" text-anchor="middle" fill="#e7e0d2" font-size="11.5">真正部署 FDE 的客户占比</text><text x="420.0" y="248" text-anchor="middle" fill="#9a6a2f" font-size="20" font-weight="800">↓</text><path d="M210.0 250 L630.0 250 L595.0 316 L245.0 316 Z" fill="#9a6a2f" opacity="0.92"></path><text x="420.0" y="280" text-anchor="middle" fill="#f6f3ec" font-size="15" font-weight="700">× 年均客单价</text><text x="420.0" y="300" text-anchor="middle" fill="#e7e0d2" font-size="11.5">单个客户年交付合同额</text><text x="420.0" y="328" text-anchor="middle" fill="#9a6a2f" font-size="20" font-weight="800">↓</text><path d="M245.0 330 L595.0 330 L560.0 396 L280.0 396 Z" fill="#1d3a5f" opacity="0.92"></path><text x="420.0" y="360" text-anchor="middle" fill="#f6f3ec" font-size="15" font-weight="700">× 续费率</text><text x="420.0" y="380" text-anchor="middle" fill="#e7e0d2" font-size="11.5">多年累计的复利系数</text><rect x="120.0" y="404" width="600" height="40" rx="8" fill="#e7e0d2"></rect><text x="420.0" y="440" text-anchor="middle" fill="#14233f" font-size="13.5" font-weight="700">市场容量 = 企业基数 × 渗透率 × 客单价 × 续费率（每个变量均可单独质疑与修正）</text></svg>
