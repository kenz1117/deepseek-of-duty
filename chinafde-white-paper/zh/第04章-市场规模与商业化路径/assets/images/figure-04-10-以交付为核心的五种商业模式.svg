<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><rect width="840" height="420" fill="#f6f3ec"></rect><text x="420.0" y="44" text-anchor="middle" fill="#14233f" font-size="19" font-weight="700" font-family="'Noto Serif SC','Songti SC',serif">以交付为核心的五种商业模式</text><rect x="24" y="78" width="152" height="250" rx="10" fill="#fffdf8" stroke="#d8cfbd" stroke-width="1.4"></rect><circle cx="100.0" cy="136" r="30" fill="#14233f"></circle><text x="100.0" y="144" text-anchor="middle" fill="#f6f3ec" font-size="20" font-weight="800">1</text><text x="100.0" y="196" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">POC / 咨询</text><text x="100.0" y="228" text-anchor="middle" fill="#5b6678" font-size="11.5">小步验证，低风险切入</text><line x1="48" y1="248" x2="152" y2="248" stroke="#d8cfbd"></line><text x="100.0" y="274" text-anchor="middle" fill="#9a6a2f" font-size="11">非互斥</text><text x="100.0" y="292" text-anchor="middle" fill="#5b6678" font-size="11">大型厂商并行 3–4 种</text><rect x="188" y="78" width="152" height="250" rx="10" fill="#fffdf8" stroke="#d8cfbd" stroke-width="1.4"></rect><circle cx="264.0" cy="136" r="30" fill="#1d3a5f"></circle><text x="264.0" y="144" text-anchor="middle" fill="#f6f3ec" font-size="20" font-weight="800">2</text><text x="264.0" y="196" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">成果分成</text><text x="264.0" y="228" text-anchor="middle" fill="#5b6678" font-size="11.5">收益绑定经营结果</text><line x1="212" y1="248" x2="316" y2="248" stroke="#d8cfbd"></line><text x="264.0" y="274" text-anchor="middle" fill="#9a6a2f" font-size="11">非互斥</text><text x="264.0" y="292" text-anchor="middle" fill="#5b6678" font-size="11">大型厂商并行 3–4 种</text><rect x="352" y="78" width="152" height="250" rx="10" fill="#fffdf8" stroke="#d8cfbd" stroke-width="1.4"></rect><circle cx="428.0" cy="136" r="30" fill="#9a6a2f"></circle><text x="428.0" y="144" text-anchor="middle" fil