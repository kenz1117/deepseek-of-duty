<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><rect width="840" height="480" fill="#f6f3ec"></rect><text x="420.0" y="42" text-anchor="middle" fill="#14233f" font-size="19" font-weight="700" font-family="'Noto Serif SC','Songti SC',serif">FDE 能力成熟度阶梯：L1 → L5</text><rect x="24" y="350" width="150" height="70" rx="8" fill="#14233f" opacity="0.92"></rect><text x="99.0" y="376" text-anchor="middle" fill="#c79a4e" font-size="16" font-weight="800">L1</text><text x="99.0" y="398" text-anchor="middle" fill="#f6f3ec" font-size="13.5" font-weight="700">执行交付</text><text x="99.0" y="416" text-anchor="middle" fill="#e7e0d2" font-size="10.5">按脚本完成标准化部署</text><rect x="184" y="280" width="150" height="140" rx="8" fill="#1d3a5f" opacity="0.92"></rect><text x="259.0" y="306" text-anchor="middle" fill="#c79a4e" font-size="16" font-weight="800">L2</text><text x="259.0" y="328" text-anchor="middle" fill="#f6f3ec" font-size="13.5" font-weight="700">独立交付</text><text x="259.0" y="346" text-anchor="middle" fill="#e7e0d2" font-size="10.5">端到端负责单客户项目</text><rect x="344" y="210" width="150" height="210" rx="8" fill="#9a6a2f" opacity="0.92"></rect><text x="419.0" y="236" text-anchor="middle" fill="#c79a4e" font-size="16" font-weight="800">L3</text><text x="419.0" y="258" text-anchor="middle" fill="#f6f3ec" font-size="13.5" font-weight="700">端到端负责</text><text x="419.0" y="276" text-anchor="middle" fill="#e7e0d2" font-size="10.5">独立定义价值指标</text><rect x="504" y="140" width="150" height="280" rx="8" fill="#1d3a5f" opacity="0.92"></rect><text x="579.0" y="166" text-anchor="middle" fill="#c79a4e" font-size="16" font-weight="800">L4</text><text x="579.0" y="188" text-anchor="middle" fill="#f6f3ec" font-size="13.5" font-weight="700">方法论设计</text><text x="579.0" y="206" text-anchor="middle" fill="#e7e0d2" font-size="10.5">跨客户沉淀交付方法论</text><rect x="664" y="70" width="150" height="350" rx="8" fill="#14233f" opacity="0.92"></rect><text x="739.0" y="96" text-anchor="middle" fill="#c79a4e" font-size="16" font-weight="800">L5</text><text x="739.0" y="118" text-anchor="middle" fill="#f6f3ec" font-size="13.5" font-weight="700">组织级采纳</text><text x="739.0" y="136" text-anchor="middle" fill="#e7e0d2" font-size="10.5">驾驭强监管·驱动组织变革</text><text x="420.0" y="460" text-anchor="middle" fill="#5b6678" font-size="12.5">能力按 L1→L5 顺序获得，不可跳级；同一职级内可跨越多级</text></svg>
