<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="410" fill="#f6f3ec"></rect>
  <text x="34" y="34" font-size="17" font-weight="700" fill="#14233f">图3-3　六项能力 × 五级成长路径（L1–L5）</text>
  <text x="34" y="56" font-size="12" fill="#6b6457">颜色越深＝该能力在对应层级越关键；L2→L3 淘汰率最高（从执行者转为"能对客户说不的人"）。</text>

  <!-- 表头 -->
  <g font-size="13" fill="#14233f" text-anchor="middle" font-weight="600">
    <text x="120" y="92">能力项</text>
    <text x="258" y="92">L1 基本功</text>
    <text x="346" y="92">L2 集成部署</text>
    <text x="434" y="92">L3 价值判断</text>
    <text x="522" y="92">L4 资产沉淀</text>
    <text x="610" y="92">L5 组织战略</text>
  </g>
  <line x1="40" y1="100" x2="650" y2="100" stroke="#14233f" stroke-width="1.2"></line>

  <!-- 行 -->
  <g font-size="12" fill="#14233f" text-anchor="start">
