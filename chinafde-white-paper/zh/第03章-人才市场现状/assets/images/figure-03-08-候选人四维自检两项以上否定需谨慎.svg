<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="410" fill="#f6f3ec"></rect>
  <text x="34" y="34" font-size="17" font-weight="700" fill="#14233f">图3-4　候选人四维自检：两项以上否定需谨慎</text>

  <!-- 左上 现场意愿 -->
  <rect x="40" y="84" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d0bf"></rect>
  <rect x="40" y="84" width="290" height="30" rx="6" fill="#2e4a78"></rect>
  <text x="54" y="104" font-size="13" font-weight="700" fill="#fff">① 现场意愿</text>
  <text x="54" y="138" font-size="12" fill="#14233f">愿长期出差驻场、接受需求反复变化？</text>
  <text x="54" y="170" font-size="11" fill="#9a3a2f">否定 → 工程能力难在客户侧持续输出</text>

  <!-- 右上 跨域理解 -->
  <rect x="350" y="84" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d0bf"></rect>
  <rect x="350" y="84" width="290" height="30" rx="6" fill="#3a6e8a"></rect>
  <text x="364" y="104" font-size="13" font-weight="700" fill="#fff">② 跨域理解</text>
  <text x="364" y="138" font-size="12" fill="#14233f">能听懂业务/财务/法务/IT 并做翻译？</text>
  <text x="364" y="170" font-size="11" fill="#9a3a2f">否定 → 长期困于"技术对、推不动"僵局</text>

  <!-- 左下 生产化习惯 -->
  <rect x="40" y="254" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d0bf"></rect>
  <rect x="40" y="254" width="290" height="30" rx="6" fill="#9a6a2f"></rect>
  <text x="54" y="274" font-size="13" font-weight="700" fill="#fff">③ 生产化习惯</text>
  <text x="54" y="308" font-size="12" fill="#14233f">愿做接口/权限/日志/文档/培训等"不酷"事？</text>
  <text x="54" y="340" font-size="11" fill="#9a3a2f">否定 → 成果止步于演示层</text>

  <!-- 右下 心智韧性 -->
  <rect x="350" y="254" width="290" height="150" rx="6" fill="#ffffff" stroke="#d8d0bf"></rect>
  <rect x="350" y="254" width="290" height="30" rx="6" fill="#14233f"></rect>
  <text x="364" y="274" font-size="13" font-weight="700" fill="#fff">④ 心智韧性</text>
  <text x="364" y="308" font-size="12" fill="#14233f">压力与否定下仍保持判断、坚持沉淀？</text>
  <text x="364" y="340" font-size="11" fill="#9a3a2f">否定 → 第二高压项目后易倦怠离场</text>
</svg>
