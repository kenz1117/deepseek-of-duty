<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="360" fill="#f6f3ec"></rect>
  <text x="34" y="34" font-size="17" font-weight="700" fill="#14233f">图3-2　FDE 复合能力五边形（初级 vs 进阶层）</text>

  <!-- 网格 -->
  <polygon points="215,65 338.6,154.8 291.4,300.2 138.6,300.2 91.4,154.8" fill="none" stroke="#c9c1b0" stroke-width="1"></polygon>
  <line x1="215" y1="195" x2="215" y2="65" stroke="#c9c1b0"></line>
  <line x1="215" y1="195" x2="338.6" y2="154.8" stroke="#c9c1b0"></line>
  <line x1="215" y1="195" x2="291.4" y2="300.2" stroke="#c9c1b0"></line>
  <line x1="215" y1="195" x2="138.6" y2="300.2" stroke="#c9c1b0"></line>
  <line x1="215" y1="195" x2="91.4" y2="154.8" stroke="#c9c1b0"></line>

  <!-- 进阶层 -->
  <polygon points="210,78 321,159 275,284 149,279 105,161" fill="#9a6a2f" fill-opacity="0.28" stroke="#9a6a2f" stroke-width="2"></polygon>
  <!-- 初级 -->
  <polygon points="210,91 309,163 241,237 183,232 148,175" fill="#2e4a78" fill-opacity="0.22" stroke="#2e4a78" stroke-width="2"></polygon>

  <!-- 轴标签 -->
  <text x="215" y="48" font-size="12" fill="#14233f" text-anchor="middle">写代码</text>
  <text x="352" y="150" font-size="12" fill="#14233f" text-anchor="middle">搭系统</text>
  <text x="300" y="322" font-size="12" fill="#14233f" text-anchor="middle">懂业务</text>
  <text x="118" y="322" font-size="12" fill="#14233f" text-anchor="middle">推组织</text>
  <text x="78" y="150" font-size="12" fill="#14233f" text-anchor="middle">合规意识</text>

  <!-- 图例 -->
  <rect x="470" y="90" width="18" height="14" fill="#2e4a78" fill-opacity="0.5"></rect>
  <text x="496" y="101" font-size="12" fill="#14233f">初级 FDE：技术侧发力</text>
  <rect x="470" y="120" width="18" height="14" fill="#9a6a2f" fill-opacity="0.5"></rect>
  <text x="496" y="131" font-size="12" fill="#14233f">进阶层：业务+组织突破</text>
  <text x="470" y="170" font-size="11" fill="#6b6457">天花板不在工程深度，</text>
  <text x="470" y="186" font-size="11" fill="#6b6457">而在业务抽象与组织推动。</text>
</svg>
