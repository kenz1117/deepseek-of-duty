<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="330" fill="#f6f3ec"></rect>
  <text x="34" y="34" font-size="17" font-weight="700" fill="#14233f">图6-1　标杆案例对比矩阵（四行业）</text>

  <!-- 表头 -->
  <g font-size="12.5" font-weight="700" fill="#fff">
    <rect x="40" y="56" width="120" height="34" fill="#14233f"></rect><text x="100" y="78" text-anchor="middle">行业</text>
    <rect x="162" y="56" width="190" height="34" fill="#14233f"></rect><text x="257" y="78" text-anchor="middle">典型场景</text>
    <rect x="354" y="56" width="160" height="34" fill="#14233f"></rect><text x="434" y="78" text-anchor="middle">价值兑现形式</text>
    <rect x="516" y="56" width="124" height="34" fill="#14233f"></rect><text x="578" y="78" text-anchor="middle">复制难度</text>
  </g>

  <!-- 行 -->
  <g font-size="11" fill="#14233f">
    <rect x="40" y="92" width="120" height="50" fill="#e9eef5"></rect><text x="100" y="122" text-anchor="middle" font-weight="600">制造</text>
    <rect x="162" y="92" width="190" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="172" y="115">钢铁排产 / 能源管理</text><text x="172" y="132">成果分成模式</text>
    <rect x="354" y="92" width="160" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="364" y="122">吨钢成本下降</text>
    <rect x="516" y="92" width="124" height="50" fill="#c3d0e3"></rect><text x="578" y="122" text-anchor="middle">中</text>

    <rect x="40" y="144" width="120" height="50" fill="#e9eef5"></rect><text x="100" y="174" text-anchor="middle" font-weight="600">金融</text>
    <rect x="162" y="144" width="190" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="172" y="167">实时反欺诈</text><text x="172" y="184">可解释合规</text>
    <rect x="354" y="144" width="160" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="364" y="174">风险拦截 + 合规</text>
    <rect x="516" y="144" width="124" height="50" fill="#7e9bc4"></rect><text x="578" y="174" text-anchor="middle">较高</text>

    <rect x="40" y="196" width="120" height="50" fill="#e9eef5"></rect><text x="100" y="226" text-anchor="middle" font-weight="600">能源</text>
    <rect x="162" y="196" width="190" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="172" y="219">设备巡检智能体</text>
    <rect x="354" y="196" width="160" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="364" y="219">停机损失降低</text>
    <rect x="516" y="196" width="124" height="50" fill="#7e9bc4"></rect><text x="578" y="219" text-anchor="middle">较高</text>

    <rect x="40" y="248" width="120" height="50" fill="#e9eef5"></rect><text x="100" y="278" text-anchor="middle" font-weight="600">零售</text>
    <rect x="162" y="248" width="190" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="172" y="271">连锁快速试错</text><text x="172" y="288">价值验证</text>
    <rect x="354" y="248" width="160" height="50" fill="#fff" stroke="#d8d0bf"></rect><text x="364" y="278">转化率 / 人效</text>
    <rect x="516" y="248" width="124" height="50" fill="#c3d0e3"></rect><text x="578" y="278" text-anchor="middle">中</text>
  </g>
</svg>
