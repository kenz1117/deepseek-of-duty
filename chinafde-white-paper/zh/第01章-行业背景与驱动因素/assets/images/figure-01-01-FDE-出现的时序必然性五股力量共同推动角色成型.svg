<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><rect width="840" height="400" fill="#f6f3ec"></rect><line x1="70" y1="210" x2="800" y2="210" stroke="#9a6a2f" stroke-width="3"></line><path d="M800 210 l-14 -7 v14 z" fill="#9a6a2f"></path><circle cx="70.0" cy="210" r="15" fill="#14233f" stroke="#c79a4e" stroke-width="2.5"></circle><text x="70.0" y="215" text-anchor="middle" fill="#f6f3ec" font-size="14" font-weight="700">1</text><text x="70.0" y="166" text-anchor="middle" fill="#9a6a2f" font-size="15" font-weight="700">2022–23</text><text x="70.0" y="252" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">大模型能力突破</text><text x="70.0" y="274" text-anchor="middle" fill="#5b6678" font-size="11.5">参数与对齐收敛，企业不再纠结「能不能用」</text><circle cx="245.0" cy="210" r="15" fill="#14233f" stroke="#c79a4e" stroke-width="2.5"></circle><text x="245.0" y="215" text-anchor="middle" fill="#f6f3ec" font-size="14" font-weight="700">2</text><text x="245.0" y="166" text-anchor="middle" fill="#9a6a2f" font-size="15" font-weight="700">2023</text><text x="245.0" y="252" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">范式迁移</text><text x="245.0" y="274" text-anchor="middle" fill="#5b6678" font-size="11.5">从卖工具转向卖结果，交付责任前移</text><circle cx="420.0" cy="210" r="15" fill="#14233f" stroke="#c79a4e" stroke-width="2.5"></circle><text x="420.0" y="215" text-anchor="middle" fill="#f6f3ec" font-size="14" font-weight="700">3</text><text x="420.0" y="166" text-anchor="middle" fill="#9a6a2f" font-size="15" font-weight="700">2024</text><text x="420.0" y="252" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">Agent 浪潮</text><text x="420.0" y="274" text-anchor="middle" fill="#5b6678" font-size="11.5">自主执行放大现场价值，也放大风险</text><circle cx="595.0" cy="210" r="15" fill="#14233f" stroke="#c79a4e" stroke-width="2.5"></circle><text x="595.0" y="215" text-anchor="middle" fill="#f6f3ec" font-size="14" font-weight="700">4</text><text x="595.0" y="166" text-anchor="middle" fill="#9a6a2f" font-size="15" font-weight="700">2024–25</text><text x="595.0" y="252" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">合规推力</text><text x="595.0" y="274" text-anchor="middle" fill="#5b6678" font-size="11.5">监管与数据治理成为外部硬约束</text><circle cx="770.0" cy="210" r="15" fill="#14233f" stroke="#c79a4e" stroke-width="2.5"></circle><text x="770.0" y="215" text-anchor="middle" fill="#f6f3ec" font-size="14" font-weight="700">5</text><text x="770.0" y="166" text-anchor="middle" fill="#9a6a2f" font-size="15" font-weight="700">2025+</text><text x="770.0" y="252" text-anchor="middle" fill="#14233f" font-size="14.5" font-weight="700">FDE 成熟</text><text x="770.0" y="274" text-anchor="middle" fill="#5b6678" font-size="11.5">中美同步，中国快速跟进</text><text x="420.0" y="378" text-anchor="middle" fill="#5b6678" font-size="12.5">五股力量先后到位，FDE 的出现是技术、商业与监管共同作用的必然结果</text></svg>
