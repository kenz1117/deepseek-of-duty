# push 到 main 自动部署到阿里云服务器（dod.goodpoint.top）
# 所需 secrets: SSH_HOST / SSH_USER / SSH_PRIVATE_KEY（专用于 CI 部署的 ed25519 密钥）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload & atomic deploy
        run: |
          SERVER="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          APP_DIR=/opt/dod-web
          tar --exclude='.DS_Store' -czf /tmp/dist.tar.gz -C dist .
          ssh "$SERVER" "mkdir -p $APP_DIR/build"
          scp /tmp/dist.tar.gz "$SERVER:$APP_DIR/build/dist.tar.gz"
          scp deploy/Dockerfile deploy/nginx-container.conf "$SERVER:$APP_DIR/build/"
          scp scripts/server-deploy.sh "$SERVER:$APP_DIR/build/"
          ssh "$SERVER" "bash $APP_DIR/build/server-deploy.sh $APP_DIR/build/dist.tar.gz"

      - name: Verify live
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://dod.goodpoint.top/)
          echo "https://dod.goodpoint.top/ → HTTP $code"
          [ "$code" = "200" ]
